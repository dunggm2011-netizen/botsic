services:
  - type: web
    name: sic
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python sic.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0
